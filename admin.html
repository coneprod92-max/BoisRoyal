<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BoisRoyal — Administration</title>
  <style>
    :root{--bg:#0b1510;--panel:#12241a;--gold:#d8b66a;--gold2:#f1d99b;--text:#f5f3eb;--muted:#b8c2b7;--line:rgba(240,226,187,.16);--red:#e07a6a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
    .wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:24px 0 60px}
    h1,h2{margin:0 0 14px;font-weight:600}
    h1{font-size:1.5rem}
    h1 span{color:var(--gold)}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
    label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px}
    input,select,textarea{width:100%;padding:10px;border-radius:5px;border:1px solid var(--line);background:#0e1b13;color:var(--text);font:inherit}
    textarea{min-height:70px;resize:vertical}
    input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
    button{font:inherit;cursor:pointer;border-radius:5px;padding:9px 14px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:600}
    button:hover{border-color:var(--gold);color:var(--gold)}
    .primary{background:var(--gold);color:#172219;border-color:var(--gold)}
    .primary:hover{background:var(--gold2);color:#172219}
    .danger:hover{border-color:var(--red);color:var(--red)}
    .login{max-width:400px;margin:12vh auto 0}
    .msg{margin-top:12px;font-size:.88rem;min-height:1.2em}
    .err{color:var(--red)}.ok{color:#8fd19e}
    table{width:100%;border-collapse:collapse;font-size:.88rem}
    th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
    th{color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
    .scroll{overflow-x:auto}
    .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.72rem;border:1px solid var(--line)}
    .on{color:#8fd19e;border-color:#8fd19e}.off{color:var(--muted)}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .row-check{display:flex;align-items:center;gap:8px;margin-top:14px}
    .row-check input{width:auto}
    .hidden{display:none}
    @media(max-width:600px){.grid2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">

  <!-- Connexion -->
  <section id="loginView" class="card login">
    <h1>Bois<span>Royal</span> · Admin</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" style="width:100%;margin-top:18px" type="submit">Se connecter</button>
      <div class="msg err" id="loginMsg" role="alert"></div>
    </form>
  </section>

  <!-- Espace admin -->
  <section id="adminView" class="hidden">
    <div class="bar">
      <h1>Bois<span>Royal</span> · Produits</h1>
      <div class="actions">
        <button class="primary" id="newBtn">+ Nouveau produit</button>
        <a href="index.html"><button type="button">Voir le site</button></a>
        <button id="logoutBtn">Déconnexion</button>
      </div>
    </div>
    <div class="msg" id="listMsg" role="status"></div>
    <div class="card scroll">
      <table>
        <thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th>Statut</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="6">Chargement…</td></tr></tbody>
      </table>
    </div>

    <div class="card hidden" id="editor" style="margin-top:20px">
      <h2 id="editorTitle">Nouveau produit</h2>
      <form id="productForm">
        <div class="grid2">
          <div><label for="f_name">Nom</label><input id="f_name" required maxlength="120"></div>
          <div><label for="f_slug">Identifiant (slug)</label><input id="f_slug" maxlength="120" placeholder="auto si vide"></div>
          <div><label for="f_category">Catégorie</label>
            <select id="f_category"><option value="bois_chauffage">Bois de chauffage</option><option value="charbon">Charbon de bois</option></select></div>
          <div><label for="f_unit">Format / unité</label><input id="f_unit" maxlength="120" placeholder="ex. 12,5 L"></div>
          <div><label for="f_price">Prix (€)</label><input id="f_price" inputmode="decimal" required placeholder="6,90"></div>
          <div><label for="f_stock">Stock</label><input id="f_stock" type="number" min="0" step="1" value="0"></div>
        </div>
        <label for="f_image">Image (chemin ou URL)</label>
        <input id="f_image" maxlength="300" placeholder="images/produit-filets.webp">
        <label for="f_desc">Description</label>
        <textarea id="f_desc" maxlength="600"></textarea>
        <label class="row-check"><input type="checkbox" id="f_active" checked> Visible sur le site</label>
        <div class="actions" style="margin-top:18px">
          <button class="primary" type="submit">Enregistrer</button>
          <button type="button" id="cancelBtn">Annuler</button>
        </div>
        <div class="msg" id="formMsg" role="status"></div>
      </form>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script>
  // Clé publique uniquement. La sécurité repose sur la connexion + les règles RLS côté Supabase.
  const SUPABASE_URL = 'https://evvblxiitorfdniqmqcf.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_pJHLKhN_Qvj8M38uFNx4ow_WktH1zZC';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = v => new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(Number(v)||0);
  const slugify = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const COLS = 'id,name,slug,category,description,price,unit,stock_quantity,is_active,image_url';

  let products = [];
  let editingId = null;

  function say(el, text, kind) { el.textContent = text || ''; el.className = 'msg ' + (kind || ''); }

  async function isAdmin() {
    const { data, error } = await db.rpc('is_br_admin');
    return !error && data === true;
  }

  async function showApp() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { $('loginView').classList.remove('hidden'); $('adminView').classList.add('hidden'); return; }
    if (!(await isAdmin())) {
      await db.auth.signOut();
      $('loginView').classList.remove('hidden'); $('adminView').classList.add('hidden');
      say($('loginMsg'), "Ce compte n'a pas les droits d'administration.", 'err');
      return;
    }
    $('loginView').classList.add('hidden'); $('adminView').classList.remove('hidden');
    loadProducts();
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    say($('loginMsg'), 'Connexion…');
    const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    $('password').value = '';
    if (error) return say($('loginMsg'), 'Email ou mot de passe incorrect.', 'err');
    say($('loginMsg'), '');
    showApp();
  });

  $('logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); showApp(); });

  async function loadProducts() {
    const { data, error } = await db.from('br_products').select(COLS).order('created_at', { ascending: true });
    if (error) { say($('listMsg'), 'Erreur de chargement : ' + error.message, 'err'); return; }
    products = data || [];
    say($('listMsg'), '');
    $('rows').innerHTML = products.length ? products.map(p => `
      <tr>
        <td><strong>${esc(p.name)}</strong><br><small style="color:var(--muted)">${esc(p.unit || '')}</small></td>
        <td>${p.category === 'charbon' ? 'Charbon' : 'Bois'}</td>
        <td>${money(p.price)}</td>
        <td>${Number(p.stock_quantity) || 0}</td>
        <td><span class="tag ${p.is_active ? 'on' : 'off'}">${p.is_active ? 'Visible' : 'Masqué'}</span></td>
        <td class="actions">
          <button data-edit="${esc(p.id)}">Modifier</button>
          <button data-toggle="${esc(p.id)}">${p.is_active ? 'Masquer' : 'Afficher'}</button>
          <button class="danger" data-del="${esc(p.id)}">Supprimer</button>
        </td>
      </tr>`).join('') : '<tr><td colspan="6">Aucun produit pour le moment.</td></tr>';
  }

  $('rows').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.dataset.edit || b.dataset.toggle || b.dataset.del;
    const p = products.find(x => String(x.id) === String(id)); if (!p) return;
    if (b.dataset.edit) return openEditor(p);
    if (b.dataset.toggle) {
      const { error } = await db.from('br_products').update({ is_active: !p.is_active }).eq('id', p.id);
      return error ? say($('listMsg'), error.message, 'err') : loadProducts();
    }
    if (b.dataset.del && confirm(`Supprimer « ${p.name} » définitivement ?`)) {
      const { error } = await db.from('br_products').delete().eq('id', p.id);
      if (error) say($('listMsg'), error.message, 'err'); else { say($('listMsg'), 'Produit supprimé.', 'ok'); loadProducts(); }
    }
  });

  function openEditor(p) {
    editingId = p ? p.id : null;
    $('editorTitle').textContent = p ? 'Modifier le produit' : 'Nouveau produit';
    $('f_name').value = p?.name || '';
    $('f_slug').value = p?.slug || '';
    $('f_category').value = p?.category || 'bois_chauffage';
    $('f_unit').value = p?.unit || '';
    $('f_price').value = p ? String(p.price).replace('.', ',') : '';
    $('f_stock').value = p?.stock_quantity ?? 0;
    $('f_image').value = p?.image_url || '';
    $('f_desc').value = p?.description || '';
    $('f_active').checked = p ? !!p.is_active : true;
    say($('formMsg'), '');
    $('editor').classList.remove('hidden');
    $('editor').scrollIntoView({ behavior: 'smooth' });
  }
  $('newBtn').addEventListener('click', () => openEditor(null));
  $('cancelBtn').addEventListener('click', () => $('editor').classList.add('hidden'));

  $('productForm').addEventListener('submit', async e => {
    e.preventDefault();
    const price = parseFloat($('f_price').value.replace(',', '.'));
    const stock = parseInt($('f_stock').value, 10);
    if (!(price >= 0)) return say($('formMsg'), 'Prix invalide.', 'err');
    if (!(stock >= 0)) return say($('formMsg'), 'Stock invalide.', 'err');
    const row = {
      name: $('f_name').value.trim(),
      slug: $('f_slug').value.trim() || slugify($('f_name').value),
      category: $('f_category').value,
      unit: $('f_unit').value.trim() || null,
      price, stock_quantity: stock,
      image_url: $('f_image').value.trim() || null,
      description: $('f_desc').value.trim() || null,
      is_active: $('f_active').checked
    };
    say($('formMsg'), 'Enregistrement…');
    const q = editingId
      ? db.from('br_products').update(row).eq('id', editingId)
      : db.from('br_products').insert(row);
    const { error } = await q;
    if (error) return say($('formMsg'), 'Erreur : ' + error.message, 'err');
    $('editor').classList.add('hidden');
    say($('listMsg'), 'Produit enregistré.', 'ok');
    loadProducts();
  });

  db.auth.onAuthStateChange(evt => { if (evt === 'SIGNED_OUT') showApp(); });
  showApp();
</script>
</body>
</html>
